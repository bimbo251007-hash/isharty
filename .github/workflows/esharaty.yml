name: Esharaty Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 1) يفك ملف الـ zip الموجود في الـ repository
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          if [ "$(ls *.zip | wc -l)" -ne 1 ]; then echo "::error::لازم يكون في ملف zip واحد بس في الـ repository"; exit 1; fi
          ZIP=$(ls *.zip | head -1)
          echo "Using $ZIP"
          mkdir extracted
          unzip -q "$ZIP" -d extracted
          ROOT=$(dirname "$(find extracted -maxdepth 2 -name package.json | head -1)")
          mv "$ROOT" project
      - uses: actions/upload-artifact@v4
        with:
          name: project
          path: project

  # 2) ينشر الموقع على GitHub Pages (تلقائي مع كل push)
  pages:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: project
          path: project
      - run: node project/scripts/build-web.js && touch project/www/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: project/www
      - id: deployment
        uses: actions/deploy-pages@v4

  # 3) ملف APK لأندرويد (تشغيل يدوي: Run workflow)
  android:
    if: github.event_name == 'workflow_dispatch'
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: project
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: project
          path: project
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npm run build:web
      - name: Use fixed signing key (so updates install over the old app)
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then echo "::error::Missing secret DEBUG_KEYSTORE_BASE64"; exit 1; fi
          mkdir -p ~/.android
          echo "$KS" | base64 -d > ~/.android/debug.keystore
      - run: |
          npx cap add android
          npx cap sync android
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
      - run: ./gradlew assembleDebug
        working-directory: project/android
      - name: Publish APK to a fixed download link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Esharaty.apk
          gh release delete latest-apk --cleanup-tag --yes --repo "${{ github.repository }}" || true
          gh release create latest-apk Esharaty.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Esharaty APK (latest)" \
            --notes "ملف APK جاهز للتثبيت على أندرويد"

  desktop:
    if: github.event_name == 'workflow_dispatch'
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    defaults:
      run:
        working-directory: project
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: project
          path: project
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run dist
      - name: Publish installer to a fixed download link
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          mkdir out
          for f in dist/*.exe dist/*.dmg dist/*.AppImage; do
            cp "$f" "out/Esharaty-${{ runner.os }}.${f##*.}"
          done
          TAG="latest-${{ runner.os }}"
          gh release delete "$TAG" --cleanup-tag --yes --repo "${{ github.repository }}" || true
          gh release create "$TAG" out/* \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Esharaty Desktop ${{ runner.os }} (latest)" \
            --notes "مثبّت التطبيق لسطح المكتب"
