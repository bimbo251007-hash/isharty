name: Esharaty Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 1) يفك ملف الـ zip الموجود في الـ repository
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          ZIP=$(ls *.zip | head -1)
          echo "Using $ZIP"
          mkdir extracted
          unzip -q "$ZIP" -d extracted
          ROOT=$(dirname "$(find extracted -maxdepth 2 -name package.json | head -1)")
          mv "$ROOT" project
      - uses: actions/upload-artifact@v4
        with:
          name: project
          path: project

  # 2) ينشر الموقع على GitHub Pages (تلقائي مع كل push)
  pages:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: project
          path: project
      - run: node project/scripts/build-web.js && touch project/www/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: project/www
      - id: deployment
        uses: actions/deploy-pages@v4

  # 3) ملف APK لأندرويد (تشغيل يدوي: Run workflow)
  android:
    if: github.event_name == 'workflow_dispatch'
    needs: prepare
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: project
          path: project
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npm run build:web
      - run: |
          npx cap add android
          npx cap sync android
      - run: ./gradlew assembleDebug
        working-directory: project/android
      - uses: actions/upload-artifact@v4
        with:
          name: esharaty-android-apk
          path: project/android/app/build/outputs/apk/debug/app-debug.apk

  # 4) تطبيق الكمبيوتر Windows / Mac / Linux (تشغيل يدوي)
  desktop:
    if: github.event_name == 'workflow_dispatch'
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    defaults:
      run:
        working-directory: project
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: project
          path: project
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: esharaty-${{ matrix.os }}
          path: |
            project/dist/*.exe
            project/dist/*.dmg
            project/dist/*.AppImage
