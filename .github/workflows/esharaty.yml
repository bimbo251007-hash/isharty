name: Esharaty Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          ZIP=$(ls *.zip | head -1)
          echo "Using $ZIP"
          mkdir extracted
          unzip -q "$ZIP" -d extracted
          ROOT=$(dirname "$(find extracted -maxdepth 2 -name package.json | head -1)")
          mv "$ROOT" project
      - uses: actions/upload-artifact@v4
        with:
          name: project
          path: project

  pages:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: project
          path: project
      - run: node project/scripts/build-web.js && touch project/www/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: project/www
      - id: deployment
        uses: actions/deploy-pages@v4

  android:
    if: github.event_name == 'workflow_dispatch'
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: project
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: project
          path: project
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npm run build:web
      - run: |
          npx cap add android
          npx cap sync android
      - run: ./gradlew assembleDebug
        working-directory: project/android
      - name: Publish APK to Releases (direct download, not zipped)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Esharaty.apk
          gh release create "apk-${{ github.run_number }}" Esharaty.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Esharaty APK #${{ github.run_number }}" \
            --notes "ملف APK جاهز للتثبيت على أندرويد"

  desktop:
    if: github.event_name == 'workflow_dispatch'
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    defaults:
      run:
        working-directory: project
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: project
          path: project
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run dist
      - name: Publish installer to Releases (direct download, not zipped)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(dist/*.exe dist/*.dmg dist/*.AppImage)
          gh release create "desktop-${{ github.run_number }}-${{ runner.os }}" "${files[@]}" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Esharaty Desktop (${{ runner.os }}) #${{ github.run_number }}" \
            --notes "مثبّت التطبيق لسطح المكتب"
